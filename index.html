<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วงล้อจับคู่ทีม</title>
<meta name="description" content="สุ่มจับทีมด้วยวงล้อ แล้วส่งผลเข้า Discord">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0B09;--surface:rgba(14,11,9,.82);--ink:#FFF6E3;--mute:#C9B99A;--line:rgba(60,230,210,.45);--gold:#2EE6D0;--red:#E5302B;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Kanit,Prompt,"Noto Sans Thai",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse 75% 42% at 50% 0%,rgba(40,225,200,.48),transparent 72%),radial-gradient(ellipse 85% 38% at 50% 108%,rgba(25,120,215,.50),transparent 70%),repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 1px,transparent 1px 24px),repeating-linear-gradient(-45deg,rgba(255,255,255,.028) 0 1px,transparent 1px 24px),linear-gradient(180deg,#06191D 0%,#050B10 55%,#041420 100%);animation:glow 9s ease-in-out infinite alternate}
body::after{content:"";position:fixed;left:-25%;right:-25%;top:0;bottom:0;z-index:-1;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% -6%,rgba(90,245,225,.14) 0 3deg,transparent 3deg 11deg);-webkit-mask-image:linear-gradient(180deg,#000,transparent 65%);mask-image:linear-gradient(180deg,#000,transparent 65%);transform-origin:50% 0;animation:sway 16s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.72}to{opacity:1}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
html::after{content:"";position:fixed;left:0;right:0;bottom:0;height:10px;z-index:5;pointer-events:none;background:repeating-linear-gradient(-45deg,#2EE6D0 0 14px,#06141A 14px 28px);box-shadow:0 -4px 18px rgba(46,230,208,.35)}
main{max-width:780px;margin:0 auto;padding:22px 16px 56px}
header{text-align:center;margin-bottom:22px}
.logo{display:block;margin:0 auto 10px;width:min(52vw,230px);height:auto;mix-blend-mode:screen}
.brush{display:inline-block;background:linear-gradient(100deg,#0A5F7A,#12B5A6 55%,#0A86A8);padding:6px 30px 10px;transform:skewX(-8deg);clip-path:polygon(2% 0,100% 6%,97% 100%,0 92%);box-shadow:0 8px 24px rgba(18,181,166,.4)}
h1{margin:0;font-size:clamp(2rem,9vw,3.2rem);line-height:1.2;font-weight:800;transform:skewX(8deg);background:linear-gradient(180deg,#F2FFFD,#6FF7E4 55%,#2BB6E8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}
p.sub{margin:14px 0 0;color:var(--ink);text-shadow:0 2px 6px #000;font-weight:400}
.card{background:var(--surface);border:2px solid var(--gold);border-radius:6px;padding:18px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));backdrop-filter:blur(3px);box-shadow:inset 0 0 40px rgba(46,230,208,.09)}
label{display:block;font-weight:600;margin-bottom:6px;color:var(--gold);font-size:1.05rem}
textarea{width:100%;min-height:170px;resize:vertical;font:inherit;color:var(--ink);background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:6px;padding:12px}
textarea::placeholder{color:#8F826B}
textarea:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:rgba(0,0,0,.55)}
.stepper button{width:44px;height:44px;border:0;background:transparent;color:var(--gold);font-size:1.4rem;cursor:pointer}
.stepper output{min-width:48px;text-align:center;font-weight:700;font-size:1.2rem}
.btn{font:700 1.05rem Kanit,Prompt,sans-serif;border:0;padding:12px 24px;min-height:48px;cursor:pointer;color:#032A30;background:linear-gradient(180deg,#8CFAEC,#17B8C9);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 0 18px rgba(46,230,208,.4)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.ghost{background:rgba(0,0,0,.6);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold);filter:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{color:#FF8A80;min-height:1.5em;margin:10px 0 0;font-size:.95rem}
#game{display:none}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 12px}
.now{text-align:center;min-height:4em}
.now b{display:block;font-size:1.9rem;line-height:1.3;font-weight:800;color:#8EFBEA;text-shadow:0 3px 0 #000}
.now span{color:var(--mute)}
.wheelbox{position:relative;width:min(86vw,380px);filter:drop-shadow(0 0 26px rgba(46,230,208,.35))}
canvas{width:100%;aspect-ratio:1;display:block}
.pointer{position:absolute;left:50%;top:-8px;width:0;height:0;transform:translateX(-50%);z-index:2;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid var(--gold);filter:drop-shadow(0 2px 0 #000)}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:16px}
.team{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:4px;padding:12px 14px;min-height:96px;backdrop-filter:blur(3px)}
.team h3{margin:0 0 6px;font-size:1.15rem;font-weight:700;display:flex;justify-content:space-between;gap:8px;color:var(--c)}
.team h3 small{color:var(--mute);font-weight:400}
.team ul{margin:0;padding:0;list-style:none}
.team li{padding:2px 0;word-break:break-word}
.team li.new{animation:pop .7s}
.team.hit{box-shadow:0 0 0 2px var(--c),0 0 24px var(--c)}
@keyframes pop{0%{background:var(--c);color:#000;transform:scale(1.08)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.team li.new{animation:none}}
input.hook{width:100%;font:inherit;color:var(--ink);background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
input.hook:focus{outline:3px solid var(--gold);outline-offset:2px}
.dc{width:100%;max-width:520px;text-align:left;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.dc small{color:var(--mute)}
.dc label.chk{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);margin:10px 0}
</style>
</head>

  <p class="sub">ใส่ชื่อสมาชิก เลือกจำนวนทีม แล้วหมุนวงล้อให้แต่ละคนได้ทีมของตัวเอง</p></header>

  <section id="setup" class="card">
    <label for="names">รายชื่อสมาชิก (1 บรรทัดต่อ 1 คน)</label>
    <textarea id="names" placeholder="สมชาย&#10;สมหญิง&#10;มานะ&#10;ปิติ"></textarea>
    <div class="row">
      <span style="font-weight:600">จำนวนทีม</span>
      <div class="stepper">
        <button id="minus" aria-label="ลดจำนวนทีม">−</button>
        <output id="tc">2</output>
        <button id="plus" aria-label="เพิ่มจำนวนทีม">+</button>
      </div>
      <span id="count" style="color:var(--mute)"></span>
    </div>
    <div class="row"><button class="btn" id="start">เริ่มจับทีม</button></div>
    <p class="msg" id="err" role="alert"></p>
  </section>

  <section id="game">
    <div class="card stage">
      <div class="now" aria-live="polite"><span id="lbl">ถึงคิวของ</span><b id="who"></b></div>
      <div class="wheelbox"><div class="pointer"></div><canvas id="cv"></canvas></div>
      <div class="acts">
        <button class="btn" id="spin">หมุนวงล้อ</button>
        <button class="btn ghost" id="auto">หมุนที่เหลือทั้งหมด</button>
      </div>
      <div class="acts">
        <button class="btn ghost" id="copy" style="display:none">คัดลอกไปวางใน Discord</button>
        <button class="btn ghost" id="again">เริ่มจับใหม่</button>
        <button class="btn ghost" id="edit">แก้ไขรายชื่อ</button>
      </div>
      <textarea id="out" readonly aria-label="ข้อความผลจับทีม" style="display:none;min-height:150px;margin-top:6px"></textarea>
      <div class="dc">
        <label for="hook">ลิงก์ Discord Webhook</label>
        <input class="hook" id="hook" type="password" autocomplete="off" placeholder="https://discord.com/api/webhooks/...">
        <small>เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่ถูกบันทึกลงไฟล์เว็บ</small>
        <label class="chk"><input type="checkbox" id="autosend" checked> ส่งเข้า Discord อัตโนมัติเมื่อจับทีมครบ</label>
        <div class="acts" style="justify-content:flex-start"><button class="btn ghost" id="send">ส่งเข้า Discord</button></div>
        <p class="msg" id="hst" role="status" style="color:var(--gold)"></p>
      </div>
    </div>
    <div class="board" id="board"></div>
  </section>
</main>

<script>
const COLORS=[["#E5302B","#fff"],["#F2B01E","#2A1600"],["#2F9BFF","#001A33"],["#8AD14B","#10260A"],["#E5702B","#fff"],["#B06BFF","#fff"],["#22C3B0","#00241F"],["#FF5FA2","#33001A"]];
const TAU=Math.PI*2, $=id=>document.getElementById(id);
let members=[],teams=[],idx=0,rot=0,busy=false,tcount=2,cap=1;
const mod=(a,b)=>((a%b)+b)%b;
const names=()=>$("names").value.split("\n").map(s=>s.trim()).filter(Boolean);
const active=()=>teams.filter(t=>t.members.length<cap);

function updateCount(){const n=names().length;$("count").textContent=n?("สมาชิก "+n+" คน"):"";}
$("names").addEventListener("input",updateCount);
$("minus").onclick=()=>{tcount=Math.max(2,tcount-1);$("tc").textContent=tcount;};
$("plus").onclick=()=>{tcount=Math.min(8,tcount+1);$("tc").textContent=tcount;};

$("start").onclick=()=>{
  const n=names();
  if(n.length<2){$("err").textContent="ใส่ชื่ออย่างน้อย 2 คน เพื่อให้แบ่งทีมได้";return;}
  if(tcount>n.length){$("err").textContent="จำนวนทีมมากกว่าจำนวนสมาชิก ลดจำนวนทีมลงหรือเพิ่มรายชื่อ";return;}
  $("err").textContent="";members=n;begin();
  $("setup").style.display="none";$("game").style.display="block";
};
function begin(){
  teams=Array.from({length:tcount},(_,i)=>({name:"ทีม "+(i+1),c:COLORS[i],members:[]}));
  for(let i=members.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[members[i],members[j]]=[members[j],members[i]];}
  cap=Math.ceil(members.length/tcount);idx=0;busy=false;
  $("copy").style.display="none";$("lbl").textContent="ถึงคิวของ";
  setBtns();renderBoard();draw();
}
function setBtns(){
  const done=idx>=members.length;
  $("spin").disabled=busy||done;$("auto").disabled=busy||done;
  $("again").disabled=busy;$("edit").disabled=busy;
  if(!done)$("who").textContent=members[idx];
}
function renderBoard(hit,newName){
  const b=$("board");b.innerHTML="";
  teams.forEach(t=>{
    const d=document.createElement("div");d.className="team"+(t===hit?" hit":"");d.style.setProperty("--c",t.c[0]);
    const h=document.createElement("h3");h.textContent=t.name;
    const s=document.createElement("small");s.textContent=t.members.length+"/"+cap;h.appendChild(s);
    const u=document.createElement("ul");
    t.members.forEach((m,i)=>{const li=document.createElement("li");li.textContent=m;
      if(t===hit&&i===t.members.length-1&&m===newName)li.className="new";u.appendChild(li);});
    d.append(h,u);b.appendChild(d);
  });
}
function draw(){
  const cv=$("cv"),size=cv.clientWidth||340,dpr=window.devicePixelRatio||1;
  cv.width=cv.height=size*dpr;
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const r=size/2-4,cx=size/2,act=active(),a=TAU/act.length;
  const font=getComputedStyle(document.body).fontFamily;
  act.forEach((t,i)=>{
    const s=rot+i*a-Math.PI/2;
    ctx.beginPath();ctx.moveTo(cx,cx);ctx.arc(cx,cx,r,s,s+a);ctx.closePath();
    ctx.fillStyle=t.c[0];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#06141A";ctx.stroke();
    ctx.save();ctx.translate(cx,cx);ctx.rotate(s+a/2);ctx.textAlign="right";ctx.textBaseline="middle";
    ctx.fillStyle=t.c[1];ctx.font="800 "+Math.round(size*.062)+"px "+font;
    ctx.fillText(t.name,r-18,0);ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cx,r,0,TAU);ctx.lineWidth=7;ctx.strokeStyle="#2EE6D0";ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cx,size*.07,0,TAU);ctx.fillStyle="#06141A";ctx.fill();
  ctx.lineWidth=4;ctx.strokeStyle="#2EE6D0";ctx.stroke();
}
window.addEventListener("resize",()=>{if($("game").style.display==="block")draw();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if($("game").style.display==="block")draw();});

function spinOnce(){
  return new Promise(res=>{
    const act=active(),i=Math.floor(Math.random()*act.length),a=TAU/act.length;
    const jit=(Math.random()-.5)*a*.7;
    const target=mod(-((i+.5)*a+jit),TAU),cur=mod(rot,TAU);
    const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    const end=rot+mod(target-cur,TAU)+TAU*(reduce?1:5),start=rot,t0=performance.now(),dur=reduce?500:4200;
    (function f(now){
      const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);
      rot=start+(end-start)*e;draw();
      if(p<1)requestAnimationFrame(f);else{rot=end;res(act[i]);}
    })(t0);
  });
}
async function doOne(){
  if(busy||idx>=members.length)return;
  busy=true;setBtns();
  const m=members[idx],t=await spinOnce();
  t.members.push(m);idx++;busy=false;
  $("lbl").textContent=m+" ได้";$("who").textContent=t.name;
  renderBoard(t,m);
  if(idx>=members.length){$("lbl").textContent="จับทีมครบแล้ว";$("who").textContent="ทุกคนมีทีมแล้ว";$("copy").style.display="";if($("autosend").checked&&okHook())sendDiscord();}
  setBtns();draw();
}
$("spin").onclick=doOne;
$("auto").onclick=async()=>{while(idx<members.length){await doOne();await new Promise(r=>setTimeout(r,700));}};
$("again").onclick=begin;
$("edit").onclick=()=>{$("game").style.display="none";$("setup").style.display="block";};
const EMO=["🟥","🟨","🟦","🟩","🟧","🟪","🩵","🩷"];
$("copy").onclick=async()=>{
  const txt="🎡 **ผลจับทีม**\n\n"+teams.map((t,i)=>EMO[i]+" **"+t.name+"** ("+t.members.length+" คน)\n"+t.members.map(m=>"• "+m).join("\n")).join("\n\n");
  const o=$("out");o.value=txt;
  try{await navigator.clipboard.writeText(txt);o.style.display="none";$("copy").textContent="คัดลอกแล้ว วางใน Discord ได้เลย";}
  catch(e){o.style.display="block";o.focus();o.select();$("copy").textContent="คัดลอกข้อความด้านล่างเอง";}
  setTimeout(()=>{$("copy").textContent="คัดลอกไปวางใน Discord";},2500);
};
try{const s=localStorage.getItem("tw-names");if(s)$("names").value=s;}catch(e){}
$("names").addEventListener("change",()=>{try{localStorage.setItem("tw-names",$("names").value);}catch(e){}});
$("start").addEventListener("click",()=>{try{localStorage.setItem("tw-names",$("names").value);}catch(e){}});

const okHook=()=>/^https:\/\/(discord|discordapp)\.com\/api\/webhooks\/\d+\/[\w-]+/.test($("hook").value.trim());
function buildText(){
  return "🎡 **ผลจับทีม**\n\n"+teams.map((t,i)=>EMO[i]+" **"+t.name+"** ("+t.members.length+" คน)\n"+t.members.map(m=>"• "+m).join("\n")).join("\n\n");
}
function chunks(text){
  const out=[];let cur="";
  for(const part of text.split("\n\n")){
    if(cur&&(cur+"\n\n"+part).length>1900){out.push(cur);cur=part;}else cur=cur?cur+"\n\n"+part:part;
  }
  if(cur)out.push(cur);return out;
}
async function sendDiscord(){
  const st=$("hst"),url=$("hook").value.trim();
  if(!okHook()){st.textContent="ใส่ลิงก์ webhook ของ Discord ให้ถูกต้องก่อน";return;}
  if(idx<members.length){st.textContent="จับทีมให้ครบก่อนจึงจะส่งได้";return;}
  try{localStorage.setItem("tw-hook",url);}catch(e){}
  st.textContent="กำลังส่ง...";$("send").disabled=true;
  try{
    for(const c of chunks(buildText())){
      const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:c,allowed_mentions:{parse:[]}})});
      if(!r.ok){st.textContent="ส่งไม่สำเร็จ (รหัส "+r.status+") ตรวจลิงก์ webhook อีกครั้ง";$("send").disabled=false;return;}
    }
    st.textContent="ส่งเข้า Discord แล้ว";
  }catch(e){st.textContent="ส่งไม่สำเร็จ ตรวจอินเทอร์เน็ตหรือลิงก์ webhook";}
  $("send").disabled=false;
}
$("send").onclick=sendDiscord;
try{const h=localStorage.getItem("tw-hook");if(h)$("hook").value=h;}catch(e){}
updateCount();
</script>
</body>
</html>
